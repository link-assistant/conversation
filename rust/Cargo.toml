[package]
name = "link-assistant-conversation"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Portable link graph for AI conversations"
license = "Unlicense"
repository = "https://github.com/link-assistant/conversation"
homepage = "https://github.com/link-assistant/conversation"
documentation = "https://docs.rs/link-assistant-conversation"
readme = "../README.md"
keywords = ["conversation", "links-notation", "agent", "codex", "claude"]
categories = ["command-line-utilities", "encoding", "parser-implementations"]
# Published to crates.io by .github/workflows/conversation.yml (trusted
# publishing first, CARGO_REGISTRY_TOKEN / CARGO_TOKEN fallback) whenever this
# version is not on crates.io yet. Bump it to release a new crate version.

[dependencies]
lino-objects-codec = "0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
