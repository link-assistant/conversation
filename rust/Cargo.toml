[package]
name = "link-assistant-conversation"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Portable link graph for AI conversations"
license = "Unlicense"
repository = "https://github.com/link-assistant/conversation"

[dependencies]
lino-objects-codec = "0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
