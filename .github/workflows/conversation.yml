name: Conversation interoperability

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  # Retries a crates.io publish (for example right after the trusted
  # publisher or a token fallback secret was configured).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-and-cross-language:
    name: Rust and cross-language archives
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Test cross-language archives
        run: npm run test:cross

      # Packages and builds the crate exactly as crates.io would receive it,
      # so a manifest or packaging problem fails the pull request instead of
      # the release on main.
      - name: Verify crates.io package
        run: cargo publish --manifest-path rust/Cargo.toml --locked --dry-run

  # Publishes rust/Cargo.toml to crates.io when its version is not there yet.
  # Trusted publishing (OIDC) first; the CARGO_REGISTRY_TOKEN / CARGO_TOKEN
  # secrets are only a fallback. crates.io's trusted publisher for this crate
  # must name this workflow file (conversation.yml). See README "Rust crate
  # releases".
  crates-io-publish:
    name: Publish Rust crate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [rust-and-cross-language]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Never cancel a publish half-way; queue the next one instead.
    concurrency:
      group: crates-io-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check whether this crate version is on crates.io
        id: check
        run: node scripts/crates-io-release.mjs check

      - name: Authenticate with crates.io (trusted publishing)
        id: crates_auth
        if: steps.check.outputs.should_publish == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        continue-on-error: true # Fall back to a token until the trusted publisher is registered.

      - name: Publish to crates.io
        if: steps.check.outputs.should_publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
        run: node scripts/crates-io-release.mjs publish

  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      !cancelled()
    needs:
      - rust-and-cross-language
      - crates-io-publish
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Fail the run when a required job was cancelled or failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/check-pipeline-status.sh
